version: '3.8'
services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/organ
    depends_on:
      - db
    volumes:
      - ./:/app
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=organ
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
